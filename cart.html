<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Masala Table - Your Cart</title>
</head>

<body style="background-color: rgb(247,248,250); overflow-x: hidden;">
  <header>
    <nav id="navbar">
      <div class="mainlogo">
        <a href="index.html"><img id="logoimage" src="images/logo.png" alt="Masala Table Logo"></a>
      </div>
      <div class="search_container">
        <input type="text" id="search_input" placeholder="Search dishes...">
        <button id="search_button">🔍</button>
      </div>
      <div class="nav_content_box">
        <div class="nav_content"><a href="index.html">Home</a></div>
        <div class="nav_content"><a href="contact.html">Contact Us</a></div>
        <div class="nav_content"><a href="about.html">About Us</a></div>
        <div class="cart">
          <a href="cart.html">
            <div class="carticon">🛒</div>
            <div class="carttext">Cart</div>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Your Cart</h1>

    <!-- script.js populates this .card div with real cart items from localStorage -->
    <div class="container">
      <div class="card" style="padding: 10px 0;">
        <!-- Cart items injected here by script.js -->
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
